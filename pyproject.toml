[project]
name = "o-jarvis-shell"
version = "1.4.0"
description = "O-jarvis Shell: Jarvis in your terminal, your Chrome and your desktop, on Meta models."
readme = "README.md"
authors = [{ name = "Octave BAHOUN-HOUTOUKPE", email = "octavebahoun@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # O-jarvis, le projet d'avant le hackathon : le moteur sur lequel tout se branche.
    "ojarvis-engine>=1.4.0",
]

[project.urls]
Repository = "https://github.com/octavebahoun/o-jarvis-shell"
"Built on" = "https://github.com/octavebahoun/O-jarvis"

[project.scripts]
o-jarvis-shell = "ojarvis_shell.shell.cli:main"
ojarvis-shell = "ojarvis_shell.shell.cli:main"
ojarvis-chrome-host = "ojarvis_shell.chrome.host:main"

[tool.uv.sources]
# O-jarvis 1.4.0, figé sur un commit : le modèle choisi par « /modele », le bloc des éléments de page.
ojarvis-engine = { git = "https://github.com/octavebahoun/O-jarvis", subdirectory = "engine", rev = "4d33f91fe22d2b802220f91e67edd3dfa94d98ac" }

# Comme dans O-jarvis : openWakeWord tourne en ONNX, son moteur TFLite (sans paquet pour
# Python 3.12) est retiré de ses dépendances déclarées.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ojarvis_shell"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "N", "C4", "PL", "TID", "T20"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ojarvis_shell"]
known-third-party = ["ojarvis"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ojarvis_shell"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sounddevice", "scipy.*", "jeepney.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "real: appelle un vrai service (lancé à la main)",
]
filterwarnings = [
  "error::DeprecationWarning:ojarvis_shell.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]
