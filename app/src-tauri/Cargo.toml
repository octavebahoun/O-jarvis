[package]
name = "o-jarvis"
version = "1.2.1"
description = "O-jarvis, assistant personnel desktop"
authors = ["Octave BAHOUN-HOUTOUKPE <octavebahoun@gmail.com>"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "ojarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
getrandom = "0.3"
libc = "0.2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
