[project]
name = "ojarvis-engine"
version = "1.3.0"
description = "Moteur d'O-jarvis : API locale, mémoire, voix et actions."
authors = [{ name = "Octave BAHOUN-HOUTOUKPE", email = "octavebahoun@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "beautifulsoup4>=4.13",
    "fastapi>=0.143.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "mss>=10",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "openai>=3.31.0",
    "openwakeword>=0.6.0",
    "pillow>=11",
    "piper-tts>=1.8.0",
    "playwright>=1.64.0,<1.65",
    "pydantic-settings>=2.16.0",
    "sounddevice>=0.5.6",
    "sqlalchemy>=2.1.4",
    "sqlite-vec>=0.1.9",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
ojarvis-engine = "ojarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ojarvis"

# openWakeWord tourne ici en ONNX : son moteur TFLite, sans paquet pour Python 3.12,
# est retiré de ses dépendances déclarées (les autres sont reprises telles quelles).
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-jsonschema>=4.23",
]
package = [
    "pyinstaller>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "N", "C4", "PL", "TID", "T20"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311"]
# Outils de développement lancés à la main : ils affichent leurs mesures.
"tools/**" = ["T201", "PLR0915", "S603", "S607"]
# Chemins à l'intérieur du bac à sable (son propre /tmp en mémoire), pas des fichiers de l'hôte.
"src/ojarvis/sandbox/runner.py" = ["S108"]
# Migrations : SQL construit à partir de noms de tables constants, jamais d'entrée utilisateur.
"src/ojarvis/db/migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ojarvis"]

[[tool.mypy.overrides]]
module = [
    "keyring.*", "secretstorage.*", "jeepney.*", "sqlite_vec.*", "onnxruntime.*",
    "scipy.*", "sounddevice", "faster_whisper.*", "ctranslate2", "openwakeword.*", "piper.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "real: appelle un vrai service ou le vrai trousseau (lancé à la main)",
]
filterwarnings = [
  "error::DeprecationWarning:ojarvis.*",
  # Le client de test de Starlette annonce un futur client HTTP ; on garde httpx, établi.
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["ojarvis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
