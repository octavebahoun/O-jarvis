<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O-jarvis</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header class="top">
      <span class="brand">◉ O-jarvis</span>
      <span id="status" class="status" data-tone="wait" role="status">Connexion à Jarvis…</span>
      <button id="stop" class="danger" type="button" hidden>Stop</button>
      <button id="new" class="ghost" type="button" title="Nouvelle conversation">Nouvelle</button>
    </header>
    <main id="thread" class="thread" aria-live="polite"></main>
    <form id="composer" class="composer">
      <label class="tab">
        <input id="with-page" type="checkbox" checked />
        <span id="tab">Onglet : —</span>
      </label>
      <label class="tab alone-switch">
        <input id="yolo" type="checkbox" />
        <span>Agir sans demander sur ce site</span>
      </label>
      <div class="row">
        <textarea
          id="text"
          rows="2"
          placeholder="Demande à Jarvis…"
          aria-label="Ta demande"
        ></textarea>
        <button id="send" class="primary" type="submit">Envoyer</button>
      </div>
    </form>
  </body>
</html>
