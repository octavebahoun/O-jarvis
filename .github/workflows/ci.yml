name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  moteur:
    name: Moteur Python
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --frozen
      - name: Navigateur de Jarvis (Chromium de Playwright)
        run: uv run playwright install --with-deps chromium
      - name: Bac à sable (image Docker et bubblewrap)
        run: |
          docker pull --quiet python:3.12-alpine
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Lint et format
        run: |
          uv run ruff check src tests tools
          uv run ruff format --check src tests tools
      - name: Typage strict
        run: uv run mypy src tests tools
      - name: Tests et couverture
        run: uv run pytest -m "not real" -rs --cov --cov-report=term --cov-fail-under=80
      - name: Audit des dépendances
        run: uv run --with pip-audit pip-audit --skip-editable --progress-spinner off

  shell:
    name: O-jarvis Shell
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: shell/uv.lock
      # Le moteur vient du dossier engine/ voisin (installé en mode éditable).
      - run: uv sync --frozen
      - name: Navigateur éphémère de voir_page (Chromium de Playwright)
        run: uv run playwright install --with-deps chromium
      - name: Lint et format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Typage strict
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest -m "not real" -rs

  interface:
    name: Interface React
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Audit des dépendances livrées
        run: pnpm audit --prod --audit-level high
      - name: Audit des outils de développement (critique uniquement, voir DECISIONS.md)
        run: pnpm audit --audit-level critical

  bout-en-bout:
    name: Bout en bout (interface + vrai moteur)
    needs: [moteur, interface]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --frozen
        working-directory: engine
      - name: Navigateur de Jarvis (Chromium de Playwright)
        run: uv run playwright install --with-deps chromium
        working-directory: engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: pnpm e2e
        working-directory: app
        env:
          OJARVIS_E2E_HOME: ${{ runner.temp }}/ojarvis-e2e
      # Données de test seulement (trousseau en mémoire, .env vide) : rien de secret.
      - name: Traces et logs du moteur en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bout-en-bout
          path: |
            artefacts/e2e-results
            ${{ runner.temp }}/ojarvis-e2e/state/logs
          retention-days: 7

  coque:
    name: Coque Tauri (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit des dépendances Rust (vulnérabilités connues)
        run: cargo audit
